<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c12">
<title>حساباتي الرسمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #0b0c12;
  --text: #ffffff;
  --muted: #a5a6b5;
  --glass: rgba(255,255,255,.075);
  --border: rgba(255,255,255,.13);
  --accent: #a78bfa;
  --shadow: rgba(0,0,0,.25);
  --glow1: rgba(125,90,220,.20);
  --glow2: rgba(40,130,190,.17);
}

body.light {
  color-scheme: light;
  --bg: #edf0f7;
  --text: #171824;
  --muted: #666b7c;
  --glass: rgba(255,255,255,.60);
  --border: rgba(255,255,255,.85);
  --accent: #7054c8;
  --shadow: rgba(70,70,100,.12);
  --glow1: rgba(150,120,230,.16);
  --glow2: rgba(70,160,210,.13);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: 'Cairo', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 15%, var(--glow1), transparent 35%),
    radial-gradient(circle at 85% 80%, var(--glow2), transparent 35%),
    var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 16px 30px;
  transition: background-color .35s ease, color .35s ease;
}

.theme-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;
  width: 48px;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: var(--text);
  font-size: 23px;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 25px var(--shadow);
  transition: transform .18s ease, background .25s ease;
}

.theme-btn:active {
  transform: scale(.85) rotate(20deg);
}

.container {
  width: 100%;
  max-width: 440px;
  text-align: center;
  animation: appear .7s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.profile {
  width: 115px;
  height: 115px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--accent);
  padding: 4px;
  background: var(--glass);
  box-shadow: 0 10px 35px var(--shadow);
  margin-bottom: 15px;
}

h1 {
  font-size: 27px;
  font-weight: 800;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
  margin-bottom: 27px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.social {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 13px 17px;
  min-height: 68px;
  text-decoration: none;
  color: var(--text);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 19px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px var(--shadow);
  transition: transform .22s ease, background .22s ease, border-color .22s ease;
  position: relative;
  overflow: hidden;
}

.social:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.social:active {
  transform: scale(.96);
  background: var(--border);
}

.social-icon {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  background: rgba(128,128,128,.12);
  flex-shrink: 0;
}

.social-icon svg {
  width: 23px;
  height: 23px;
  fill: currentColor;
}

.social-info {
  text-align: right;
  flex: 1;
}

.social-info strong {
  display: block;
  font-size: 14px;
  font-weight: 700;
}

.social-info span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  direction: ltr;
  text-align: right;
}

.arrow {
  font-size: 19px;
  color: var(--muted);
  transition: transform .2s;
}

.social:hover .arrow {
  transform: translateX(-4px);
  color: var(--accent);
}

.instagram .social-icon { color: #e879b0; }
.facebook .social-icon { color: #5297ff; }
.snapchat .social-icon { color: #c7ad00; }
.tiktok .social-icon { color: #36bfb0; }
.whatsapp .social-icon { color: #25d366; }

.footer {
  color: var(--muted);
  font-size: 11px;
  margin-top: 25px;
}

@media (max-width: 380px) {
  h1 { font-size: 23px; }
  .social { padding: 11px 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

</main>

<script>
(function () {
  const button = document.getElementById('themeBtn');
  const metaTheme = document.querySelector('meta[name="theme-color"]');

  let savedTheme = 'dark';

  try {
    const stored = localStorage.getItem('profile-theme');
    if (stored === 'light' || stored === 'dark') {
      savedTheme = stored;
    }
  } catch (error) {}

  function applyTheme(theme) {
    const light = theme === 'light';

    document.body.classList.toggle('light', light);
    button.textContent = light ? '🌙' : '☀️';
    button.setAttribute('aria-pressed', String(light));
    button.setAttribute(
      'aria-label',
      light ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري'
    );

    metaTheme.setAttribute(
      'content',
      light ? '#edf0f7' : '#0b0c12'
    );

    try {
      localStorage.setItem('profile-theme', light ? 'light' : 'dark');
    } catch (error) {}
  }

  applyTheme(savedTheme);

  button.addEventListener('click', function () {
    const currentlyLight = document.body.classList.contains('light');
    applyTheme(currentlyLight ? 'dark' : 'light');
  });
})();
</script>

</html>
